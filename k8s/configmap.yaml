apiVersion: v1
kind: ConfigMap
metadata:
  name: log-system-config
  namespace: log-system
data:
  # ClickHouse
  CLICKHOUSE_HOST: "clickhouse"
  CLICKHOUSE_PORT: "8123"

  # Redis
  REDIS_URL: "redis://redis:6379"

  # Anomaly detector
  MODEL_DIR: "/app/models"

  # Collector
  ENVIRONMENT: "production"
