---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collector
  namespace: log-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collector
  template:
    metadata:
      labels:
        app: collector
    spec:
      containers:
        - name: collector
          image: log-system-collector:latest
          imagePullPolicy: Never       # use local image loaded into kind
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: log-system-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: collector
  namespace: log-system
spec:
  selector:
    app: collector
  ports:
    - port: 8080
      targetPort: 8080
